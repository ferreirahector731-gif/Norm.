name: Build All Platforms

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ./norm_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: 'norm_src'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate assets
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Build
        run: flutter build windows --release

      - name: Verify binary exists
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $exe = Get-ChildItem "$buildDir\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe found in ${buildDir}!"
            exit 1
          }
          Write-Output "$($exe.Name) ✅"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Build Universal Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O".\installer\Output" /F"Norm_${{ github.ref_name }}_Setup" .\installer\setup.iss

      - name: Verify installer exists
        run: |
          $installer = ".\installer\Output\Norm_${{ github.ref_name }}_Setup.exe"
          if (Test-Path $installer) {
            Write-Output "Installer ✅ $((Get-Item $installer).Length/1MB) MB"
          } else {
            Write-Error "Installer not found!"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: norm_src/installer/Output/Norm_${{ github.ref_name }}_Setup.exe

  build-android:
    continue-on-error: true
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./norm_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: 'norm_src'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Generate assets
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Verify and rename APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk "Norm_${{ github.ref_name }}.apk"
            echo "Universal APK ✅ $(du -h Norm_${{ github.ref_name }}.apk | cut -f1)"
          else
            echo "APK not found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: norm_src/Norm_${{ github.ref_name }}.apk

  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./norm_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: 'norm_src'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install Linux deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev dpkg-dev

      - name: Generate assets
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Build
        run: flutter build linux --release --verbose

      - name: Verify bundle exists
        run: |
          if [ -d "build/linux/x64/release/bundle" ]; then
            echo "bundle dir ✅"
          else
            echo "bundle dir not found!"
            ls -la build/linux/x64/release/
            exit 1
          fi

      - name: Package (.deb)
        run: |
          PKG_ROOT=$(pwd)/linux-package
          rm -rf "$PKG_ROOT"
          mkdir -p "$PKG_ROOT/DEBIAN"
          mkdir -p "$PKG_ROOT/usr/share/norm"
          mkdir -p "$PKG_ROOT/usr/bin"
          mkdir -p "$PKG_ROOT/usr/share/applications"
          mkdir -p "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps"

          cp -r build/linux/x64/release/bundle/* "$PKG_ROOT/usr/share/norm/"
          chmod +x "$PKG_ROOT/usr/share/norm/nota_ia_app"
          ln -sf /usr/share/norm/nota_ia_app "$PKG_ROOT/usr/bin/norm"

          if [ -f "linux/icon.png" ]; then
            cp linux/icon.png "$PKG_ROOT/usr/share/icons/hicolor/256x256/apps/com.norm.app.png"
          fi

          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Norm' \
            'Comment=Norm — Tu espacio para pensar' \
            'Exec=/usr/bin/norm' \
            'Icon=com.norm.app' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Office;Utility;' \
            'StartupWMClass=nota_ia_app' \
            > "$PKG_ROOT/usr/share/applications/com.norm.app.desktop"

          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' \
            'Package: norm' \
            "Version: $VERSION" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Depends: libgtk-3-0 (>= 3.24), liblzma5 (>= 5.2), libc6 (>= 2.31)' \
            'Maintainer: Norm Studio <norm@norm.app>' \
            'Description: Norm — Tu espacio para pensar' \
            ' Notas, pizarrones y ofimática en un espacio limpio' \
            ' y privado con asistente local.' \
            > "$PKG_ROOT/DEBIAN/control"

          dpkg-deb --build "$PKG_ROOT" "$PKG_ROOT/../Norm_Linux_${{ github.ref_name }}.deb"
          echo "✅ .deb built at $(ls -lh "$PKG_ROOT/../Norm_Linux_${{ github.ref_name }}.deb" | awk '{print $5}')"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: norm_src/Norm_Linux_${{ github.ref_name }}.deb

  build-macos:
    continue-on-error: true
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./norm_src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: 'norm_src'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Generate assets
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter pub run flutter_launcher_icons
          flutter pub run flutter_native_splash:create

      - name: Build
        run: |
          flutter build macos --release --verbose 2>&1
          BUILD_EXIT_CODE=$?
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ Build de macOS falló con código $BUILD_EXIT_CODE"
            exit $BUILD_EXIT_CODE
          fi

      - name: Verify app exists
        run: |
          if [ -d "build/macos/Build/Products/Release/nota_ia_app.app" ]; then
            echo "nota_ia_app.app ✅"
          else
            echo "app not found!"
            ls -la build/macos/Build/Products/Release/
            exit 1
          fi

      - name: Package (.dmg)
        run: |
          APP="build/macos/Build/Products/Release/nota_ia_app.app"
          DMG="Norm_macOS_${{ github.ref_name }}.dmg"
          hdiutil create -volname "Norm ${{ github.ref_name }}" \
            -srcfolder "$APP" \
            -ov -format UDZO -fs HFS+ \
            "$DMG"
          echo "✅ .dmg built at $(du -h "$DMG" | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: norm_src/Norm_macOS_${{ github.ref_name }}.dmg

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-android, build-macos]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          body: |
            ## Descargar según tu sistema operativo

            | Sistema operativo | Instalador |
            |---|---|
            | **Windows 10/11** | `*_Setup.exe` |
            | **Android 8+** | `*.apk` |
            | **Linux (deb)** | `Norm_Linux_*.deb` |
            | **macOS** | `Norm_macOS_*.dmg` |
          files: |
            artifacts/**/*.exe
            artifacts/**/*.apk
            artifacts/**/*.deb
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          path: 'norm_src'
          fetch-depth: 0
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: norm_src/docs
          publish_branch: gh-pages
          force_orphan: true
